name: First Club
description: >-
  FirstClub is a member-exclusive quick-commerce grocery platform operating in
  Bengaluru and Hyderabad, India, delivering curated, quality-inspected groceries
  in as little as 30 minutes from physical "ClubHouses" rather than traditional
  dark stores. The company targets India's top-tier consumers with only trusted,
  tasted, and tested products, screening out a published list of banned
  ingredients across categories including fruits and vegetables, dairy and eggs,
  bakery, staples, kids nutrition, packaged foods, snacks and beverages, health
  supplements, and cleaning essentials. FirstClub also offers a subscription
  model, "FirstClub Mornings." Founded by ex-Flipkart executive Ayyappan R, the
  company is backed by Accel and RTP Global. It surfaces here as an API
  Evangelist network profile; FirstClub is a consumer mobile-app business and
  currently publishes no public developer API, SDK, or API documentation.
